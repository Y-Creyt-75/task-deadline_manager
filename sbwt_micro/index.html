<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Task &amp; Deadline Manager</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="css/style.css" rel="stylesheet">
</head>
<body>
<header class="top"><h1>TASK / DEADLINE MANAGER</h1><span>v1.0</span></header>
<main class="container-fluid p-3">
  <section class="row g-3 mb-3" id="counters" aria-label="Summary"></section>
  <div class="row g-3">
    <aside class="col-lg-4">
      <section class="panel">
        <h2 id="formTitle">ADD TASK</h2>
        <form id="taskForm" novalidate>
          <label for="title">Title</label><input id="title" type="text">
          <label for="subject">Subject</label><input id="subject" type="text">
          <label for="category">Category</label>
          <select id="category"><option value="">-- select --</option><option>Assignment</option><option>Lab Work</option><option>Exam Prep</option></select>
          <label for="deadline">Deadline</label><input id="deadline" type="date">
          <label for="priority">Priority</label>
          <select id="priority"><option value="">-- select --</option><option>Low</option><option>Medium</option><option>High</option></select>
          <label for="notes">Notes (optional)</label><textarea id="notes" rows="2"></textarea>
          <p id="errors" class="errors" role="alert"></p>
          <button type="submit" id="submitBtn">[ ADD TASK ]</button>
          <button type="button" id="cancelBtn" hidden>[ CANCEL ]</button>
        </form>
      </section>
      <section class="panel mt-3">
        <h2>CHARTS</h2>
        <canvas id="doughnut" height="180"></canvas>
        <canvas id="bar" height="180" class="mt-3"></canvas>
      </section>
    </aside>
    <section class="col-lg-8">
      <div class="panel">
        <h2>TASKS</h2>
        <div class="row g-2 mb-3">
          <div class="col-md-6"><input id="search" type="search" placeholder="search title / subject..." aria-label="Search"></div>
          <div class="col-4 col-md-2"><select id="fStatus" aria-label="Status"><option value="all">All</option><option value="pending">Pending</option><option value="done">Done</option></select></div>
          <div class="col-4 col-md-2"><select id="fCat" aria-label="Category"><option value="all">Any type</option><option>Assignment</option><option>Lab Work</option><option>Exam Prep</option></select></div>
          <div class="col-4 col-md-2"><select id="fPri" aria-label="Priority"><option value="all">Any pri.</option><option>Low</option><option>Medium</option><option>High</option></select></div>
        </div>
        <p id="message" class="msg"></p>
        <ul id="list" class="list-unstyled m-0"></ul>
      </div>
    </section>
  </div>
</main>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.3/dist/chart.umd.min.js"></script>
<script src="js/app.js"></script>
</body>
</html>
